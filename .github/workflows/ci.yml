name: CI

on:
  push:
    branches:
      - master
      - "feat/**"
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: server-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/OpenNet.Server/OpenNet.Server.slnx

      - name: Build
        run: dotnet build src/OpenNet.Server/OpenNet.Server.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test src/OpenNet.Server/OpenNet.Server.slnx --configuration Release --no-build --no-restore
