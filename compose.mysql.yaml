services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    ports:
      - "${MYSQL_PUBLISH_ADDRESS:-127.0.0.1}:${MYSQL_PUBLISHED_PORT:-13306}:3306"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-opennet}
      MYSQL_USER: ${MYSQL_USER:-opennet}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - opennet-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  server:
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      ConnectionStrings__TraversalDirectory: "Server=mysql;Port=3306;Database=${MYSQL_DATABASE:-opennet};User=${MYSQL_USER:-opennet};Password=${MYSQL_PASSWORD};SslMode=Preferred"

volumes:
  opennet-mysql:
