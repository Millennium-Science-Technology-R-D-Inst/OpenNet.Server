services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DatabaseProvider: MySql
      ConnectionStrings__TraversalDirectory: "Server=${MYSQL_HOST:-host.docker.internal};Port=${MYSQL_PORT:-3306};Database=${MYSQL_DATABASE:-opennet};User=${MYSQL_USER:-opennet};Password=${MYSQL_PASSWORD};SslMode=${MYSQL_SSL_MODE:-Preferred}"
      TraversalDirectory__ManagementApiKey: ${OPENNET_MANAGEMENT_API_KEY}
    ports:
      - "5090:8080"
