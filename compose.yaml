services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: opennet
      MYSQL_USER: opennet
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - opennet-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  server:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DatabaseProvider: MySql
      ConnectionStrings__TraversalDirectory: Server=mysql;Port=3306;Database=opennet;User=opennet;Password=${MYSQL_PASSWORD};SslMode=Preferred
      TraversalDirectory__ManagementApiKey: ${OPENNET_MANAGEMENT_API_KEY}
    ports:
      - "5090:8080"

volumes:
  opennet-mysql:
